<style>
  :root {
    --bg: #0a0a0b;
    --bg-2: #111114;
    --bg-card: #13141A;
    --accent: #14F0C8;
    --accent-2: #0EBFA0;
    --accent-soft: rgba(20, 240, 200, 0.08);
    --accent-border: rgba(20, 240, 200, 0.18);
    --text: #ffffff;
    --text-2: rgba(255, 255, 255, 0.6);
    --text-3: rgba(255, 255, 255, 0.4);
  }
  html, body { background: var(--bg); }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .font-display { font-family: 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  /* Сітка-фон */
  .bg-grid {
    background-image:
      radial-gradient(circle at 20% 10%, rgba(20,240,200,0.10), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(20,240,200,0.06), transparent 50%),
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: auto, auto, 56px 56px, 56px 56px;
  }

  /* Зернистий шум */
  .noise::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: .04;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='1'/></svg>");
    mix-blend-mode: overlay;
    z-index: 100;
  }

  /* ========== ТЕМНА КАРТКА ФРАЗИ ========== */
  .phrase-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 22px;
    transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s, opacity .4s, border-color .35s, background .35s;
    position: relative;
    overflow: hidden;
  }
  .phrase-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 100% 0%, rgba(20,240,200,0.08), transparent 40%);
    opacity: 0;
    transition: opacity .4s;
    pointer-events: none;
  }
  .phrase-card:hover {
    transform: translateY(-3px);
    border-color: rgba(20,240,200,0.25);
    box-shadow: 0 30px 60px -25px rgba(20,240,200,0.15);
  }
  .phrase-card:hover::before { opacity: 1; }
  .phrase-card.leaving {
    opacity: 0;
    transform: scale(0.94) translateY(-10px);
    pointer-events: none;
  }

  /* ========== HERO ЗАГОЛОВОК (Figma) ========== */
  .hero-box {
    container-type: inline-size;
    position: relative;
    width: 100%;
    max-width: 820px;
    margin-top: 4px;
  }
  .hero-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 836 / 336;
  }
  .hero-stage > * { position: absolute; }

  .hero-top, .hero-500, .hero-fraz {
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    font-size: 16.75cqw;
    line-height: 1.05;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .hero-top  { left: 0; top: 0; color: #fff; }
  .hero-500  { left: 51.91%; top: 0; color: var(--accent); text-shadow: 0 5px 40px rgba(21,240,199,0.4); }
  .hero-fraz { left: 0; top: 48.2%; color: var(--accent); }

  .hero-word {
    font-family: 'Onest', sans-serif;
    font-weight: 400;
    font-size: 3.83cqw;
    line-height: 1;
    color: #fff;
    white-space: nowrap;
  }
  .hero-w1 { left: 65.91%; top: 58.6%; }
  .hero-w2 { left: 69.26%; top: 68.8%; }
  .hero-w3 { left: 81.82%; top: 79.5%; }

  .hero-neb {
    left: 62.44%; top: 36.6%;
    width: 37.56%;
    aspect-ratio: 314 / 81;
    z-index: 5;
    pointer-events: none;
  }
  .hero-neb img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .hero-curl {
    left: 90.5%; top: 63%;
    width: 5.4%;
    aspect-ratio: 69.546 / 101.102;
    height: auto;
    object-fit: contain;
    pointer-events: none;
    z-index: 4;
  }

  /* Pill з фразою */
  .pill {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 9px 16px 10px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.01em;
    line-height: 1.25;
    display: inline-block;
    border: 1px solid var(--accent-border);
    text-transform: uppercase;
  }
  .pill .ua {
    color: #fff;
    font-weight: 400;
    font-size: 15px;
    text-transform: none;
    letter-spacing: 0;
  }

  .example-text {
    color: var(--text-2);
    font-style: italic;
    font-size: 16px;
    line-height: 1.55;
  }

  /* Яскрава плашка з номером */
  .num-row {
    text-align: left;
    margin-bottom: 16px;
    position: relative;
    z-index: 11;
  }
  .num-chip {
    display: inline-block;
    min-width: 70px;
    text-align: center;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.06em;
    line-height: 1;
    color: #0a0a0b;
    background: var(--accent);
    padding: 7px 20px 8px;
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(20,240,200,0.4);
    user-select: none;
    transition: transform .3s, box-shadow .3s;
  }
  .phrase-card:hover .num-chip {
    transform: scale(1.05);
    box-shadow: 0 6px 22px rgba(20,240,200,0.6);
  }
  @media (min-width: 640px) {
    .num-chip { min-width: 84px; font-size: 19px; padding: 8px 24px 9px; }
  }

  /* ========== TELEGRAM-STYLE VOICE PLAYER ========== */
  .voice-player {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(20,240,200,0.04);
    border: 1px solid rgba(20,240,200,0.12);
    border-radius: 999px;
    padding: 5px 14px 5px 5px;
    flex: 1;
    min-width: 0;
    transition: background .25s, border-color .25s;
  }
  .voice-player:hover {
    background: rgba(20,240,200,0.07);
    border-color: rgba(20,240,200,0.22);
  }
  .voice-player.active {
    background: rgba(20,240,200,0.09);
    border-color: rgba(20,240,200,0.3);
  }

  .vp-play {
    width: 34px; height: 34px;
    border-radius: 999px;
    background: var(--accent);
    color: #0a0a0b;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    transition: transform .15s, background .15s;
    border: none;
  }
  .vp-play:hover { transform: scale(1.06); }
  .vp-play:active { transform: scale(0.96); }

  .vp-bars {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 2px;
    height: 28px;
    cursor: pointer;
    min-width: 0;
  }
  .vp-bar {
    flex: 1;
    background: rgba(255,255,255,0.22);
    border-radius: 2px;
    min-height: 3px;

  { id: 88, en: "TO HAVE A HANGOVER", ua: "Мати похмілля", example: "I had a terrible hangover the next day.", audioUrl: "audio/88.m4a" },
  { id: 89, en: "TO NOT BE A BIG DEAL", ua: "Нічого страшного", example: "\"I forgot to call him.\" \"It's not a big deal.\"", audioUrl: "audio/89.m4a" },
  { id: 90, en: "TO OWE SOMEBODY ONE", ua: "Бути чиїмсь боржником", example: "I owe you one.", audioUrl: "audio/90.m4a" },
  { id: 91, en: "TO SHOW OFF", ua: "Випендрюватися, понтуватися", example: "He's always showing off his new car.", audioUrl: "audio/91.m4a" },
  { id: 92, en: "TO HOLD YOUR HORSES", ua: "Притримай коней, не поспішай", example: "Hold your horses, we still have a lot of time.", audioUrl: "audio/92.m4a" },
  { id: 93, en: "GAS OR TRASH", ua: "Норм чи стрьом", example: "Check out my new sneakers - gas or trash?", audioUrl: "audio/93.m4a" },
  { id: 94, en: "THANKS IN ADVANCE", ua: "Дякую завчасно", example: "I appreciate your help, thanks in advance.", audioUrl: "audio/94.m4a" },
  { id: 95, en: "TO LET SLEEPING DOGS LIE", ua: "Залишити все, як є", example: "The best plan is just to let sleeping dogs lie.", audioUrl: "audio/95.m4a" },
  { id: 96, en: "TO SLIP ONE'S MIND", ua: "Вилітати з голови", example: "It slipped my mind", audioUrl: "audio/96.m4a" },
  { id: 97, en: "TO HAVE GOOSEBUMPS", ua: "Мати мурахи по шкірі", example: "That song gives me goosebumps every time. / Look at my arm - I have goosebumps!", audioUrl: "audio/97.m4a" },
  { id: 98, en: "DON'T BE SO HARD ON YOURSELF", ua: "Відчепись від себе, не придерайся до себе", example: "Don't be so hard on yourself - it wasn't your fault.", audioUrl: "audio/98.m4a" },
  { id: 99, en: "TO LOOK FORWARD TO", ua: "Чекати з нетерпінням", example: "I'm really looking forward to seeing my family again.", audioUrl: "audio/99.m4a" },
  { id: 100, en: "TO GO ON A DATE", ua: "Піти на побачення", example: "We're going on a date tonight.", audioUrl: "audio/100.m4a" },
  { id: 101, en: "GIVE OR TAKE", ua: "Плюс мінус", example: "The trip costs $500, give or take.", audioUrl: "audio/101.m4a" },
  { id: 102, en: "TO GET A TICKET", ua: "Отримати штраф", example: "I was speeding and I got a ticket.", audioUrl: "audio/102.m4a" },
  { id: 103, en: "TO GO THE EXTRA MILE", ua: "Докласти додаткових зусиль, більше ніж треба", example: "She's a great assistant. She always goes the extra mile.", audioUrl: "audio/103.m4a" },
  { id: 104, en: "TO BE A WALK IN THE PARK", ua: "Простіше простого, як два пальці", example: "The exam was a walk in the park.", audioUrl: "audio/104.m4a" },
  { id: 105, en: "TO TAKE A RAIN CHECK", ua: "Перенести на інший раз, іншим разом", example: "I'd love to come, but I'll have to take a rain check.", audioUrl: "audio/105.m4a" },
  { id: 106, en: "TO BREAK A PROMISE", ua: "Не стримати обіцянку, порушити обіцянку", example: "I'm sorry I broke my promise.", audioUrl: "audio/106.m4a" },
  { id: 107, en: "TO LOOK FOR", ua: "Шукати", example: "They're looking for a bigger apartment.", audioUrl: "audio/107.m4a" },
  { id: 108, en: "TO RUN LATE", ua: "Запізнюватися", example: "We're running late - let's hurry.", audioUrl: "audio/108.m4a" },
  { id: 109, en: "TO BE ON FOR SOMETHING", ua: "Бути в силі", example: "Are you on for a movie this weekend?", audioUrl: "audio/109.m4a" },
  { id: 110, en: "TO WATCH OUT", ua: "Бути обережним, стерегтися", example: "Watch out! There's a car coming.", audioUrl: "audio/110.m4a" },
  { id: 111, en: "TO HIT THE BOOKS", ua: "Вчитися, робити домашку", example: "I can't go to the party. I need to hit the books.", audioUrl: "audio/111.m4a" },
  { id: 112, en: "TO BREAK THE BANK", ua: "Розоритися, бити по кишені", example: "This vacation is going to break the bank.", audioUrl: "audio/112.m4a" },
  { id: 113, en: "TO READ BETWEEN THE LINES", ua: "Читати між рядків", example: "You have to read between the lines to understand what she really means.", audioUrl: "audio/113.m4a" },
  { id: 114, en: "TO JUMP THE GUN", ua: "Забігати наперед, поспішати з висновками", example: "He jumped the gun and announced the news too early.", audioUrl: "audio/114.m4a" },
  { id: 115, en: "THROUGH THICK AND THIN", ua: "У радості і в горі, попри всі труднощі", example: "My family supported me through thick and thin.", audioUrl: "audio/115.m4a" },
  { id: 116, en: "TO SLEEP ON IT", ua: "Переспати з цією думкою", example: "I need to sleep on it before I decide.", audioUrl: "audio/116.m4a" },
  { id: 117, en: "TO MAKE A MISTAKE", ua: "Зробити помилку", example: "She made a big mistake by quitting her job.", audioUrl: "audio/117.m4a" },
  { id: 118, en: "TO CATCH A COLD", ua: "Застудитися", example: "Put on a jacket or you'll catch a cold.", audioUrl: "audio/118.m4a" },
  { id: 119, en: "TO TAKE A NAP", ua: "Подрімати", example: "I always take a nap after lunch.", audioUrl: "audio/119.m4a" },
  { id: 120, en: "TO GO DOWNHILL", ua: "Піти по одному місцю", example: "His career went downhill after the scandal.", audioUrl: "audio/120.m4a" },
  { id: 121, en: "TO CALL A SPADE A SPADE", ua: "Називати речі своїми іменами", example: "He's not afraid to call a spade a spade.", audioUrl: "audio/121.m4a" },
  { id: 122, en: "TO DO SOMETHING OFF THE CUFF", ua: "Eкспромтом, без підготовки", example: "He gave a great speech off the cuff.", audioUrl: "audio/122.m4a" },
  { id: 123, en: "THE ELEPHANT IN THE ROOM", ua: "Очевидна проблема, яку всі ігнорують", example: "We need to talk about the elephant in the room.", audioUrl: "audio/123.m4a" },
  { id: 124, en: "TO BE UP IN THE AIR", ua: "Бути під питанням, висіти в повітрі", example: "Our vacation plans are still up in the air.", audioUrl: "audio/124.m4a" },
  { id: 125, en: "TO SHOOT ONESELF IN THE FOOT", ua: "Самому собі нашкодити, самому собі вирити яму", example: "He shot himself in the foot by lying to his boss.", audioUrl: "audio/125.m4a" },
  { id: 126, en: "TO KILL TWO BIRDS WITH ONE STONE", ua: "Вбити двох зайців одним пострілом", example: "I do my best thinking on walks, so I take work calls outside - kills two birds with one stone.", audioUrl: "audio/126.m4a" },
  { id: 127, en: "TO MISS THE BOAT", ua: "Упустити можливість, проґавити шанс", example: "If you don't act fast, you'll miss the boat.", audioUrl: "audio/127.m4a" },
  { id: 128, en: "TO TAKE SOMETHING WITH A PINCH OF SALT", ua: "Сприймати з недовірою, ставитися скептично", example: "Take everything he says with a pinch of salt.", audioUrl: "audio/128.m4a" },
  { id: 129, en: "TO NOT CARE", ua: "Все одно, байдуже", example: "I don't care what they think.", audioUrl: "audio/129.m4a" },
  { id: 130, en: "WHO WOULD HAVE THOUGHT", ua: "Хто б міг подумати", example: "Who would have thought a year ago that everything would change like this?", audioUrl: "audio/130.m4a" },
  { id: 131, en: "TO BE SICK OF", ua: "Задовбало, втомитися від чогось", example: "I'm sick of this weather.", audioUrl: "audio/131.m4a" },
  { id: 132, en: "BLESS YOU", ua: "Будь здоровий", example: "Bless you!", audioUrl: "audio/132.m4a" },
  { id: 133, en: "TO FORGET IT", ua: "Забий", example: "\"What did you want to ask me?\" \"Oh, forget it - it's not important.\"", audioUrl: "audio/133.m4a" },
  { id: 134, en: "SOMEBODY WOULD MAKE A GOOD", ua: "З когось вийде хороший", example: "She would make a good teacher - she's patient and explains things well.", audioUrl: "audio/134.m4a" },
  { id: 135, en: "TO FIGURE OUT", ua: "Розібратися, вияснити", example: "I can't figure out how this works.", audioUrl: "audio/135.m4a" },
  { id: 136, en: "LIKE MOTHER LIKE DAUGHTER, LIKE FATHER LIKE SON", ua: "Яблуко від яблуні недалеко падає", example: "She loves cooking just like her mom - like mother, like daughter.", audioUrl: "audio/136.m4a" },
  { id: 137, en: "TO LOSE YOUR TOUCH", ua: "Втратити хватку, втратити навички", example: "I haven't played guitar in years. I've completely lost my touch.", audioUrl: "audio/137.m4a" },
  { id: 138, en: "TO STARE AT", ua: "Витріщатися", example: "Stop staring at me.", audioUrl: "audio/138.m4a" },
  { id: 139, en: "ON GOOD/BAD TERMS", ua: "В хороших/поганих відносинах, по хорошому/поганому", example: "Their relationship ended on good terms.", audioUrl: "audio/139.m4a" },
  { id: 140, en: "TO TOTALLY AGREE", ua: "Повністю погоджуватись", example: "She totally agreed with the plan.", audioUrl: "audio/140.m4a" },
  { id: 141, en: "TO BE UP TO SOMEONE", ua: "На чийсь розсуд, як хтось захоче", example: "\"Where should we go for dinner?\" \"It's up to you.\"", audioUrl: "audio/141.m4a" },
  { id: 142, en: "SORRY TO BOTHER YOU", ua: "Вибач, що турбую", example: "Sorry to bother you, but do you have a minute?", audioUrl: "audio/142.m4a" },
  { id: 143, en: "TO BE HAPPY FOR SOMEONE", ua: "Бути радим за когось", example: "\"We're getting married next year.\" \"I'm really happy for you!\"", audioUrl: "audio/143.m4a" },
  { id: 144, en: "TO DRAG ONE'S FEET", ua: "Тягнути кота за хвіст", example: "\"Why is the project taking so long?\" \"The team is dragging their feet.\"", audioUrl: "audio/144.m4a" },
  { id: 145, en: "THE POWER WENT OUT", ua: "Світло вимкнули", example: "\"Why is it so dark in here?\" \"The power went out about an hour ago.\"", audioUrl: "audio/145.m4a" },
  { id: 146, en: "THE SOONER THE BETTER", ua: "Чим швидше, тим краще", example: "\"When should I see a doctor about this?\" \"The sooner, the better.", audioUrl: "audio/146.m4a" },
  { id: 147, en: "TO RUN ON EMPTY", ua: "Бути на нулі, працювати на останніх силах", example: "I should take a day off. I'm running on empty.", audioUrl: "audio/147.m4a" },
  { id: 148, en: "TO READ MY MIND", ua: "Читати думки, зняти з язика", example: "\"Should we cancel and stay home?\" \"You read my mind.\"", audioUrl: "audio/148.m4a" },
  { id: 149, en: "TO BE A GOOD CALL", ua: "Це гарне рішення", example: "\"Let's book the hotel now before prices go up.\" \"That's a good call.\"", audioUrl: "audio/149.m4a" },
  { id: 150, en: "TO SPILL THE TEA", ua: "Пліткувати, колотись, розповісти все", example: "\"I know something about your ex.\" \"Spill the tea right now!\"", audioUrl: "audio/150.m4a" },
  { id: 151, en: "NO WAY", ua: "Да ну нафіг, не може бути, та ну", example: "\"I got tickets to the sold-out concert.\" \"No way! How did you get them?»", audioUrl: "audio/151.m4a" },
  { id: 152, en: "IT'S NOT THE END OF THE WORLD", ua: "Це не кінець світу", example: "\"I failed my driving test.\" \"It's not the end of the world, you can try again.\"", audioUrl: "audio/152.m4a" },
  { id: 153, en: "I'M OVER IT", ua: "Мені вже все одно, я це пережив, змирився", example: "\"Are you still upset about the breakup?\" \"No, I'm over it.\"", audioUrl: "audio/153.m4a" },
  { id: 154, en: "YOU HAD ONE JOB", ua: "Коли хтось провалив просте завдання, ти й з цим не справився", example: "\"Sorry, I didn't send the email.\" \"You had one job!\"", audioUrl: "audio/154.m4a" },
  { id: 155, en: "IT IS WHAT IT IS", ua: "Є як є", example: "\"I really wanted that promotion.\" \"I know, but it is what it is.\"", audioUrl: "audio/155.m4a" },
  { id: 156, en: "YOU DO YOU", ua: "Роби, як знаєш", example: "\"I don't want to take your advice on this.\" — \"Okay, you do you.\"", audioUrl: "audio/156.m4a" },
  { id: 157, en: "TO BE ABOUT TO", ua: "Ось ось почати щось робити", example: "The movie is about to start.", audioUrl: "audio/157.m4a" },
  { id: 158, en: "I'D LOVE TO, BUT…", ua: "Я б залюбки, але… (ввічлива відмова)", example: "I'd love to, but I have to wake up early tomorrow.", audioUrl: "audio/158.m4a" },
  { id: 159, en: "TO HIT SOMEBODY UP", ua: "Зв'язатися з кимось, написати, зателефонувати", example: "I'll hit you up when I'm done.", audioUrl: "audio/159.m4a" },
  { id: 160, en: "TO FREAK OUT", ua: "Панікувати", example: "People just freaked out when they heard the news.", audioUrl: "audio/160.m4a" },
  { id: 161, en: "TO GET ALONG WITH", ua: "Знаходити спільну мову, мати гарні відносини", example: "They seem to get along with each other.", audioUrl: "audio/161.m4a" },
  { id: 162, en: "CAN'T STAND", ua: "Не могти терпіти", example: "I can't stand working in an office.", audioUrl: "audio/162.m4a" },
  { id: 163, en: "TAKE IT EASY", ua: "Не бери в голову, сприймай легше", example: "\"Take it easy! Yelling won't help.\" \"You're right, I need to calm down.\"", audioUrl: "audio/163.m4a" },
  { id: 164, en: "TO KEEP IN TOUCH", ua: "Бути на зв'язку, не пропадай", example: "\"I'm moving to another city next month.\" \"That's sad, keep in touch, okay?\"", audioUrl: "audio/164.m4a" },
  { id: 165, en: "LIKEWISE", ua: "Навзаєм", example: "\"I really enjoyed our conversation.\" \"Likewise, we should do it again.\"", audioUrl: "audio/165.m4a" },
  { id: 166, en: "WHAT A RELIEF", ua: "Яке полегшення, гора з плечей", example: "\"The surgery went perfectly.\" \"What a relief.\"", audioUrl: "audio/166.m4a" },
  { id: 167, en: "THANK GOD", ua: "Слава Богу", example: "\"The doctor said everything is fine.\" \"Thank God, I was so worried.\"", audioUrl: "audio/167.m4a" },
  { id: 168, en: "TO BE PROUD OF", ua: "Пишатися кимось/чимось", example: "\"I quit smoking last month.\" \"Wow, I'm proud of you.\"", audioUrl: "audio/168.m4a" },
  { id: 169, en: "STRAIGHT UP", ua: "«Атвічаю», без жартів, я тобі кажу, чесне слово", example: "Straight up! That movie was amazing.", audioUrl: "audio/169.m4a" },
  { id: 170, en: "THAT'S BRUTAL", ua: "Це жорстко", example: "\"I have to work three weekends in a row.\" \"That's brutal, man.\"", audioUrl: "audio/170.m4a" },
  { id: 171, en: "TO GET OLD", ua: "Cтаріти", example: "\"I think my back hurts more than it used to.\" \"Yeah, we're getting old.\"", audioUrl: "audio/171.m4a" },
  { id: 172, en: "TO TAKE ADVANTAGE OF", ua: "Скористатися (можливістю)", example: "\"There's a 50% off sale at the mall.\" \"Let's take advantage of it!\"", audioUrl: "audio/172.m4a" },
  { id: 173, en: "TO COME UP WITH", ua: "Придумати, вигадати", example: "We need to come up with a plan fast.", audioUrl: "audio/173.m4a" },
  { id: 174, en: "TO GET FIRED", ua: "Бути звільненим", example: "He got fired for being late too many times.", audioUrl: "audio/174.m4a" },
  { id: 175, en: "TO MAKE A MESS", ua: "Насмітити", example: "\"Why is the kitchen so dirty?\" \"The kids made a mess again.\"", audioUrl: "audio/175.m4a" },
  { id: 176, en: "SAY NO MORE", ua: "Більше ні слова, я зрозумів з пів слова", example: "\"Could you please help me out?\" \"Say no more.\"", audioUrl: "audio/176.m4a" },
  { id: 177, en: "TO COME CLOSE", ua: "Навіть і поруч не стоїть", example: "\"Is anyone better than him on the team?\" \"Nobody comes close.\"", audioUrl: "audio/177.m4a" },
  { id: 178, en: "TO BUY SOME TIME", ua: "Виграти час", example: "I need to buy some time to think.", audioUrl: "audio/178.m4a" },
  { id: 179, en: "TO GET READY FOR", ua: "Готуватися", example: "I'm getting ready for the marathon in October.", audioUrl: "audio/179.m4a" },
  { id: 180, en: "TO MAKE UP ONE'S MIND", ua: "Визначитися, вирішити, обрати", example: "I made up my mind. I'm moving to Spain.", audioUrl: "audio/180.m4a" },
  { id: 181, en: "TO MAKE A DIFFERENCE", ua: "Щось змінити, зробити внесок, змінити на краще", example: "You really made a difference in my life.", audioUrl: "audio/181.m4a" },
  { id: 182, en: "IT DEPENDS", ua: "Коли як", example: "\"How long does it take?\" \"It depends.\"", audioUrl: "audio/182.m4a" },
  { id: 183, en: "TO BE ALLERGIC TO", ua: "Мати алергію на", example: "My son is allergic to dairy.", audioUrl: "audio/183.m4a" },
  { id: 184, en: "FINGERS CROSSED", ua: "Тримаю кулачки", example: "\"I have a job interview tomorrow.\" \"Fingers crossed!\"", audioUrl: "audio/184.m4a" },
  { id: 185, en: "ENJOY YOUR MEAL", ua: "Смачного", example: "Enjoy your meal.", audioUrl: "audio/185.m4a" },
  { id: 186, en: "WHEN PIGS FLY", ua: "Коли рак на горі свисне", example: "She'll forgive him when pigs fly.", audioUrl: "audio/186.m4a" },
  { id: 187, en: "TO ADD FUEL TO THE FIRE", ua: "Підлити масла у вогонь", example: "Don't add fuel to the fire by arguing with him now.", audioUrl: "audio/187.m4a" },
  { id: 188, en: "TO TRIP OVER", ua: "Спіткнутися", example: "Be careful, don't trip over the cable.", audioUrl: "audio/188.m4a" },
  { id: 189, en: "THAT'S WHY…", ua: "Ось чому", example: "I forgot my umbrella. That's why I'm soaked.", audioUrl: "audio/189.m4a" },
  { id: 190, en: "WITH FLYING COLORS", ua: "Успішно, блискуче, на відмінно", example: "She passed the exam with flying colors.", audioUrl: "audio/190.m4a" },
  { id: 191, en: "THE EASY WAY OUT", ua: "Найлегше, що можна зробити, найлегший шлях", example: "Quitting is the easy way out.", audioUrl: "audio/191.m4a" },
  { id: 192, en: "WHAT ON EARTH…?", ua: "Що в біса, що нафіг…", example: "What on earth are you doing?", audioUrl: "audio/192.m4a" },
  { id: 193, en: "IN A NUTSHELL", ua: "Коротше кажучи", example: "Let me explain it in a nutshell.", audioUrl: "audio/193.m4a" },
  { id: 194, en: "TO HAVE NO SIGNAL", ua: "Не мати зв'язку, погано ловить", example: "I have no signal in the kitchen. Can you hear me?", audioUrl: "audio/194.m4a" },
  { id: 195, en: "TO HAVE A HEADACHE", ua: "Мати головний біль", example: "I've had a headache all day.", audioUrl: "audio/195.m4a" },
  { id: 196, en: "I WISH I KNEW", ua: "Якби ж я знав", example: "Don't ask me what I want. I wish I knew.", audioUrl: "audio/196.m4a" },
  { id: 197, en: "TO SCREW UP", ua: "Облажатися, накосячити", example: "Don't screw up this time!", audioUrl: "audio/197.m4a" },
  { id: 198, en: "TO GET DIVORCED", ua: "Розлучитися", example: "They got divorced last year.", audioUrl: "audio/198.m4a" },
  { id: 199, en: "DON'T COUN'T YOUR CHICKENS (BEFORE THEY HATCH)", ua: "Не кажи гоп, поки не перескочиш", example: "We haven't won yet, don't count your chickens.", audioUrl: "audio/199.m4a" },
  { id: 200, en: "TO HAVE FUN", ua: "Розважатися, гарно проводити час", example: "We had fun last night.", audioUrl: "audio/200.m4a" },
  { id: 201, en: "TO THE BITTER END", ua: "До самого кінця", example: "This boxer fought to the bitter end.", audioUrl: "audio/201.m4a" },
  { id: 202, en: "WHEN DID YOU LAST…?", ua: "Коли ти останній раз…?", example: "When did you last see him?", audioUrl: "audio/202.m4a" },
  { id: 203, en: "WHAT ARE YOU WEARINT TO…?", ua: "У чому ти підеш на…?", example: "What are you wearing to the airport?", audioUrl: "audio/203.m4a" },
  { id: 204, en: "TO AIR OUT", ua: "Провітрювати", example: "I'm airing out the room.", audioUrl: "audio/204.m4a" },
  { id: 205, en: "TO CHANGE ONE'S MIND", ua: "Передумати", example: "Are you still moving to Paris?\" — \"No, I changed my mind.\"", audioUrl: "audio/205.m4a" },
  { id: 206, en: "ARE YOU DECENT?", ua: "Ти одягнений? Можна заходити?", example: "\"Are you decent?\" \"Yeah, come in!\"", audioUrl: "audio/206.m4a" },
  { id: 207, en: "TO BE BROKE", ua: "Бути на мілі, погане фінансове становище", example: "\"Let's go to that fancy restaurant!\" \"I'd love to, but I'm broke.\"", audioUrl: "audio/207.m4a" },
  { id: 208, en: "IF I'M NOT MISTAKEN", ua: "Якщо я не помиляюсь", example: "\"What time does the meeting start?\" \"At 3 PM, if I'm not mistaken.\"", audioUrl: "audio/208.m4a" },
  { id: 209, en: "WHERE WERE WE?", ua: "На чому ми зупинились?", example: "Sorry, my phone rang. Where were we?", audioUrl: "audio/209.m4a" },
  { id: 210, en: "A BLESSING IN DISGUISE", ua: "Щось, що спочатку здавалося поганим, але виявилось на користь", example: "\"My business failed last year.\" \"It was a blessing in disguise, look at the amazing company you built from those lessons.\"", audioUrl: "audio/210.m4a" },
  { id: 211, en: "TO BE STARVING", ua: "Помирати з голоду", example: "\"What's for dinner?\" \"Anything! I'm starving.\"", audioUrl: "audio/211.m4a" },
  { id: 212, en: "TO BREATHE DOWN MY NECK", ua: "Стояти над душею", example: "How can I work when you're breathing down my neck?", audioUrl: "audio/212.m4a" },
  { id: 213, en: "TO STEAL SOMEONE'S THUNDER", ua: "Украсти чийсь момент слави, забрати чиюсь увагу, перетягнути ковдру на себе", example: "I was about to share my good news, but my sister stole my thunder by announcing her engagement.", audioUrl: "audio/213.m4a" },
  { id: 214, en: "TO THROW IN THE TOWEL", ua: "Здатися", example: "After trying for hours to fix the computer, I threw in the towel and called an expert.", audioUrl: "audio/214.m4a" },
  { id: 215, en: "TO CATCH SOMEONE RED-HANDED", ua: "Спіймати на гарячому", example: "The accountant was caught red-handed stealing money from the company.", audioUrl: "audio/215.m4a" },
  { id: 216, en: "TO KILL TIME", ua: "Вбивати час", example: "I read a magazine to kill time at the airport.", audioUrl: "audio/216.m4a" },
  { id: 217, en: "TO JUMP ON THE BANDWAGON", ua: "Підхопити тренд, зробити те, що стає популярним", example: "Companies are jumping on the bandwagon of AI without really understanding it.", audioUrl: "audio/217.m4a" },
  { id: 218, en: "LIKE TWO PEAS IN A POD", ua: "Як дві краплі води", example: "My sister and I are like two peas in a pod.", audioUrl: "audio/218.m4a" },
  { id: 219, en: "STRAIGHT FROM THE HORSE'S MOUTH", ua: "З перших уст", example: "Don't believe the rumors, I got the news straight from the horse's mouth.", audioUrl: "audio/219.m4a" },
  { id: 220, en: "TO TAKE WITH A PINCH OF SALT", ua: "Сприймати з недовірою", example: "Take everything he says with a pinch of salt.", audioUrl: "audio/220.m4a" },
  { id: 221, en: "DON'T PISS ON MY LEG AND TELL ME IT'S RAINING", ua: "Не вішай мені локшину на вуха", example: "He tried to lie, but I told him: don't piss on my leg and tell me it's raining.", audioUrl: "audio/221.m4a" },
  { id: 222, en: "A DIME A DOZEN", ua: "Як грибів після дощу", example: "Coffee shops in this city are a dime a dozen.", audioUrl: "audio/222.m4a" },
  { id: 223, en: "TO COMPARE APPLES TO ORANGES", ua: "Як порівнювати хрін* з пальцем", example: "Comparing iPhone to Android is comparing apples to oranges.", audioUrl: "audio/223.m4a" },
  { id: 224, en: "YOU CAN SAY THAT AGAIN", ua: "І не кажи, золоті слова", example: "\"That movie was disappointing.\" \"You can say that again.\"", audioUrl: "audio/224.m4a" },
  { id: 225, en: "TYPICAL OF", ua: "Типово для", example: "It's typical of Dima not to notice my new dress.", audioUrl: "audio/225.m4a" },
  { id: 226, en: "TO WASTE SOMEONE'S TIME", ua: "Витрачати час марно", example: "Don't waste my time with useless questions.", audioUrl: "audio/226.m4a" },
  { id: 227, en: "TO FEEL DIZZY", ua: "Голова крутиться, паморочиться", example: "I felt dizzy after standing up too fast.", audioUrl: "audio/227.m4a" },
  { id: 228, en: "TO BE INTO SOMETHING", ua: "Захоплюватися чимось", example: "My brother is really into video games.", audioUrl: "audio/228.m4a" },
  { id: 229, en: "I CAN'T WAIT", ua: "Вже не можу дочекатися", example: "I can't wait for summer to get there.", audioUrl: "audio/229.m4a" },
  { id: 230, en: "TO MAKE FUN OF SOMEONE", ua: "Прикалуватись з когось/чогось", example: "They were making fun of the way he walked.", audioUrl: "audio/230.m4a" },
  { id: 231, en: "TO PUT OFF", ua: "Відкладати на потім, переносити", example: "I keep putting off going to the dentist.", audioUrl: "audio/231.m4a" },
  { id: 232, en: "TO HAVE PATIENCE", ua: "Мати терпіння", example: "I don't have patience for slow drivers.", audioUrl: "audio/232.m4a" },
  { id: 233, en: "TO SLOW DOWN", ua: "Сповільнюватися, не поспішати", example: "Please slow down, you're driving too fast.", audioUrl: "audio/233.m4a" },
  { id: 234, en: "TO GET THE HANG OF IT", ua: "Освоїти, навчитися", example: "It took me a few weeks to get the hang of driving.", audioUrl: "audio/234.m4a" },
  { id: 235, en: "TO SOUND LIKE A BROKEN RECORD", ua: "Повторюватися як заїжджена платівка", example: "I know I sound like a broken record, but you really need to get more sleep.", audioUrl: "audio/235.m4a" },
  { id: 236, en: "TO BLOW SOMEONE'S MIND", ua: "Вразити, відвал голови, вау", example: "Bro, that trick just blew my mind.", audioUrl: "audio/236.m4a" },
  { id: 237, en: "TO GET RID OF SOMETHING", ua: "Позбутися когось/чогось", example: "I need to get rid of this old phone.", audioUrl: "audio/237.m4a" },
  { id: 238, en: "TO BLOW OFF SOME STEAM", ua: "Випустити пар", example: "She needed to blow off some steam after a stressful day.", audioUrl: "audio/238.m4a" },
  { id: 239, en: "TO GO FOR A RUN", ua: "Піти на пробіжку", example: "I like to go for a run in the morning.", audioUrl: "audio/239.m4a" },
  { id: 240, en: "I'M SORRY TO HEAR THAT", ua: "Мені прикро/шкода це чути", example: "I'm sorry to hear that.", audioUrl: "audio/240.m4a" },
  { id: 241, en: "TO FALL IN LOVE", ua: "Закохатися", example: "They fell in love at first sight.", audioUrl: "audio/241.m4a" },
  { id: 242, en: "TO GIVE SOMEONE PROPS", ua: "Віддати комусь належне", example: "I have to give him props for his hard work.", audioUrl: "audio/242.m4a" },
  { id: 243, en: "TO TAKE SOMETHING FOR GRANTED", ua: "Cприймати щось як належне", example: "We often take our health for granted.", audioUrl: "audio/243.m4a" },
  { id: 244, en: "AHEAD OF TIME", ua: "Завчасно", example: "He booked the tickets ahead of time.", audioUrl: "audio/244.m4a" },
  { id: 245, en: "TO GRAB A BITE", ua: "Поїсти, перекусити", example: "Let's grab a bite before the movie.", audioUrl: "audio/245.m4a" },
  { id: 246, en: "TO BINGE-WATCH", ua: "Дивитися серіал залпом", example: "She loves to binge-watch TV shows on weekends.", audioUrl: "audio/246.m4a" },
  { id: 247, en: "TO BE OUT OF PRACTICE", ua: "Відвикнути щось робити, втратив навик", example: "\"You're good at this!\" \"I'm actually out of practice.\"", audioUrl: "audio/247.m4a" },
  { id: 248, en: "WHAT SHOULD I DO WITH THIS?", ua: "А я тут до чого?", example: "\"I don't like how my life is going.\" \"What should I do with it?\"", audioUrl: "audio/248.m4a" },
  { id: 249, en: "TO PICK HOLES", ua: "Шукати недоліки, чіплятись до дрібниць, доколупуватись", example: "He always picks holes in my ideas.", audioUrl: "audio/249.m4a" },
  { id: 250, en: "TO BE SWAMPED", ua: "Бути дуже зайнятим", example: "\"Why didn't you call me back?\" \"I was swamped.\"", audioUrl: "audio/250.m4a" },
  { id: 251, en: "TO DO A 180", ua: "Переобутися, повністю змінити думку", example: "\"You were against it yesterday.\" \"I know, I did a 180.\"", audioUrl: "audio/251.m4a" },
  { id: 252, en: "TO BOOK A HOTEL", ua: "Забронювати готель", example: "I want to book a hotel in Kyiv.", audioUrl: "audio/252.m4a" },
  { id: 253, en: "TO BE IN HOT WATER", ua: "Потрапити в неприємності", example: "You'll be in hot water if you lie.", audioUrl: "audio/253.m4a" },
  { id: 254, en: "THE TRAFFIC IS HARD", ua: "Сильні затори", example: "The traffic is always hard in the morning on this bridge.", audioUrl: "audio/254.m4a" },
  { id: 255, en: "TO KEEP AN EYE ON", ua: "Приглядати, контролювати, не спускати очей", example: "Can you keep an eye on my bag?", audioUrl: "audio/255.m4a" },
  { id: 256, en: "NONE OF YOUR BUSINESS", ua: "Не твоє діло/справа (грубо)", example: "\"Who are you texting?\" \"None of your business.\"", audioUrl: "audio/256.m4a" },
  { id: 257, en: "CURIOSITY KILLED THE CAT", ua: "Менше знаєш, краще спиш", example: "\"Should I ask them?\" \"Maybe not. Curiosity killed the cat.\"", audioUrl: "audio/257.m4a" },
  { id: 258, en: "TO BRING UP", ua: "Заводити розмову", example: "Don't bring up this topic when talking to my sister.", audioUrl: "audio/258.m4a" },
  { id: 259, en: "TO COUNT ON", ua: "Розраховувати на", example: "Can I count on you?", audioUrl: "audio/259.m4a" },
  { id: 260, en: "A NEEDLE IN A HAYSTACK", ua: "Голка в стозі сіна", example: "My password is saved somewhere, but it's a needle in a haystack.", audioUrl: "audio/260.m4a" },
  { id: 261, en: "TO CHEER UP", ua: "Підбадьорити", example: "I tried to cheer him up by telling a joke.", audioUrl: "audio/261.m4a" },
  { id: 262, en: "I FEEL NAUSEOUS", ua: "Мене нудить", example: "\"Why are you so pale?\" \"I feel nauseous.\"", audioUrl: "audio/262.m4a" },
  { id: 263, en: "TO GET IT OFF YOUR CHEST", ua: "Виговоритися, зняти тягар з душі", example: "Talking to my friend helped me get it off my chest.", audioUrl: "audio/263.m4a" },
  { id: 264, en: "HERE YOU GO", ua: "Ось, тримай (коли щось даємо в руки)", example: "\"Can I have a napkin?\" \"Sure, here you go.\"", audioUrl: "audio/264.m4a" },
  { id: 265, en: "HERE WE GO AGAIN", ua: "Знову за старе, починається, опять 25", example: "\"The kids are fighting in the back seat.\" - \"Here we go again!\"", audioUrl: "audio/265.m4a" },
  { id: 266, en: "ARE YOU GOOD TO …?", ua: "Тобі ок…?", example: "Are you good to drive?", audioUrl: "audio/266.m4a" },
  { id: 267, en: "SUFFICE TO SAY…", ua: "Скажу лише…", example: "Suffice to say, we don't talk anymore.", audioUrl: "audio/267.m4a" },
  { id: 268, en: "TO TAKE YOUR TIME", ua: "Не поспішати, спокійно", example: "\"I'll be there in 10 minutes.\" \"Take your time.\"", audioUrl: "audio/268.m4a" },
  { id: 269, en: "TO HAVE A CHAT", ua: "Теревенити, базікати, говорити", example: "I had a nice chat with my neighbor this morning.", audioUrl: "audio/269.m4a" },
  { id: 270, en: "TO TAKE A TEST", ua: "Здавати тест, писати контрольну", example: "\"Why are you studying so hard?\" \"I have to take a test on Friday.\"", audioUrl: "audio/270.m4a" },
  { id: 271, en: "TO BE ALLOWED TO", ua: "Дозволяти щось робити", example: "You're allowed to leave early today.", audioUrl: "audio/271.m4a" },
  { id: 272, en: "TO DO A FAVOR", ua: "Зробити послугу", example: "Can you do me a favor?", audioUrl: "audio/272.m4a" },
  { id: 273, en: "TO HAVE A LOT ON ONE'S PLATE", ua: "Мати багато справ, мати багато всього на плечах", example: "Sorry I haven't called, I've had a lot on my plate.", audioUrl: "audio/273.m4a" },
  { id: 274, en: "WHAT DO YOU CALL THIS IN ENGLISH?", ua: "Як це буде англійською?", example: "What do you call this in English? (Показуємо на предмет)", audioUrl: "audio/274.m4a" },
  { id: 275, en: "LUCKY YOU", ua: "Щасливчик, пощастило ж тобі", example: "You won a trip to Hawaii? Lucky you!", audioUrl: "audio/275.m4a" },
  { id: 276, en: "CAT GOT YOUR TONGUE?", ua: "Язика проковтнув?", example: "What's wrong? Cat got your tongue?", audioUrl: "audio/276.m4a" },
  { id: 277, en: "TO BE DEAD", ua: "Дуже смішно (Мертвий від сміху)", example: "That meme is so funny, I'm dead!", audioUrl: "audio/277.m4a" },
  { id: 278, en: "A STONE'S THROW AWAY", ua: "Дуже близько, рукою подати", example: "\"Where do you live?\" \"A stone's throw away from the school.\"", audioUrl: "audio/278.m4a" },
  { id: 279, en: "TO BE AROUND THE CORNER", ua: "Дуже скоро (за рогом)", example: "Christmas is just around the corner.", audioUrl: "audio/279.m4a" },
  { id: 280, en: "TO GO ON VACATION", ua: "Поїхати у відпустку", example: "We're planning to go on vacation soon.", audioUrl: "audio/280.m4a" },
  { id: 281, en: "YOU SNOOZE, YOU LOSE", ua: "Хто не вспів той запізнився", example: "The discount ended yesterday. You snooze, you lose.", audioUrl: "audio/281.m4a" },
  { id: 282, en: "TO KEEP THE CHANGE", ua: "Решти не потрібно", example: "Keep the change.", audioUrl: "audio/282.m4a" },
  { id: 283, en: "MUM'S THE WORD", ua: "Це секрет, тримай язик за зубами", example: "Mum's the word until we make it official.", audioUrl: "audio/283.m4a" },
  { id: 284, en: "WE'LL SEE", ua: "Побачимо, буде видно", example: "I'm not sure yet, we'll see.", audioUrl: "audio/284.m4a" },
  { id: 285, en: "ARE YOU FOR REAL?", ua: "Ти серйозно? Ти жартуєш?", example: "\"We're moving to Bali next month.\" \"Wait, are you for real?\"", audioUrl: "audio/285.m4a" },
  { id: 286, en: "IT'S ON ME", ua: "Я заплачу, я пригощаю", example: "\"How much do I owe you?\" \"Nothing, it's on me.\"", audioUrl: "audio/286.m4a" },
  { id: 287, en: "TO HAVE MY HAIR CUT", ua: "Підстригтися", example: "I'm going to have my hair cut tomorrow.", audioUrl: "audio/287.m4a" },
  { id: 288, en: "I NEED TO GET GOING", ua: "Мені вже треба йти", example: "Sorry guys, we can talk later, I need to get going.", audioUrl: "audio/288.m4a" },
  { id: 289, en: "FOR THE SAKE OF", ua: "Заразди когось/чогось", example: "They stayed together for the sake of the children.", audioUrl: "audio/289.m4a" },
  { id: 290, en: "I'M ON MY WAY", ua: "Вже йду, скоро буду, вже на шляху", example: "\"Where are you?\" \"I'm on my way!\"", audioUrl: "audio/290.m4a" },
  { id: 291, en: "PAIN IN THE NECK", ua: "Заноза, «загвоздка»", example: "My old car keeps breaking down. It's a pain in the neck.", audioUrl: "audio/291.m4a" },
  { id: 292, en: "THAT'S TOO BAD", ua: "Шкода, жаль", example: "Oh, that's too bad. I hoped you'd be there.", audioUrl: "audio/292.m4a" },
  { id: 293, en: "TO SLEEP LIKE LOG", ua: "Спати, як вбитий", example: "My husband sleeps like a log. Nothing wakes him up.", audioUrl: "audio/293.m4a" },
  { id: 294, en: "TO MAKE UP", ua: "Вигадати щось", example: "It's not true. I made it up.", audioUrl: "audio/294.m4a" },
  { id: 295, en: "TO NEVER GOT AROUND TO", ua: "Руки не доходять", example: "He never got around to fixing the car.", audioUrl: "audio/295.m4a" },
  { id: 296, en: "SORRY?", ua: "Я не почув", example: "\"Can you pass me the salt?\" \"Sorry?\"", audioUrl: "audio/296.m4a" },
  { id: 297, en: "I NEED SOME LABS", ua: "Мені треба здати аналізи", example: "I need some labs before my surgery.", audioUrl: "audio/297.m4a" },
  { id: 298, en: "TO RUN OUT OF", ua: "Закінчуватись", example: "We're running out of milk.", audioUrl: "audio/298.m4a" },
  { id: 299, en: "AT THE ELEVENTH HOUR", ua: "В останній момент", example: "I feel bad canceling at the eleventh hour.", audioUrl: "audio/299.m4a" },
  { id: 300, en: "IF I WERE YOU, I WOULD…", ua: "На твоєму місці я б...", example: "If I were you, I would apologize.", audioUrl: "audio/300.m4a" },
  { id: 301, en: "GOOD RIDDANCE", ua: "Скатертю дорога, баба з воза - кобилі легше", example: "My ex is dating someone new. Good riddance!", audioUrl: "audio/301.m4a" },
  { id: 302, en: "HELP YOURSELF", ua: "Пригощайся", example: "Help yourself!", audioUrl: "audio/302.m4a" },
  { id: 303, en: "BY THE BOOK", ua: "По книжці, без відхилинь, точно як треба", example: "She feels she has to go by the book and can't use her creativity.", audioUrl: "audio/303.m4a" },
  { id: 304, en: "TO HIT THE NAIL ON THE HEAD", ua: "Влучно сказати, сказати/зробити в яблучко", example: "You really hit the nail on the head with that comment.", audioUrl: "audio/304.m4a" },
  { id: 305, en: "TO PULL AN ALL-NIGHTER", ua: "Працювати ніч напроліт, не спати щоб щось закінчити", example: "I had to pull an all-nighter to finish my presentation.", audioUrl: "audio/305.m4a" },
  { id: 306, en: "OUT OF THE BLUE", ua: "Як грім серед ясного неба, несподівано", example: "She called me out of the blue after ten years.", audioUrl: "audio/306.m4a" },
  { id: 307, en: "TO PULL STRINGS", ua: "Використовувати зв'язки, скористатися знайомствами", example: "He pulled strings to get his son into that school.", audioUrl: "audio/307.m4a" },
  { id: 308, en: "TO BURN BRIDGES", ua: "Спалити мости, розірвати стосунки назавжди", example: "Don't burn bridges with your old boss.", audioUrl: "audio/308.m4a" },
  { id: 309, en: "TO PUT ALL YOUR EGGS IN ONE BASKET", ua: "Покласти всі яйця в один кошик, робити ставку лише на одне", example: "Don't put all your eggs in one basket when investing.", audioUrl: "audio/309.m4a" },
  { id: 310, en: "TO PUT IT MILDLY", ua: "М'яко кажучи", example: "The food was awful, to put it mildly.", audioUrl: "audio/310.m4a" },
  { id: 311, en: "TO BE ON THIN ICE", ua: "На тонкому льоду, ходити по лезу ножа", example: "You're on thin ice with the boss after that mistake.", audioUrl: "audio/311.m4a" },
  { id: 312, en: "OUT OF ONE'S LEAGUE", ua: "Не твого рівня, не по зубах, не твого поля ягода", example: "That car is out of my league.", audioUrl: "audio/312.m4a" },
  { id: 313, en: "TO LOSE ONE'S TEMPER", ua: "Вийти з себе, зірватися", example: "I lost my temper and said things I regret.", audioUrl: "audio/313.m4a" },
  { id: 314, en: "TO BREAK A HUNDRED", ua: "Розміняти сотку (гроші)", example: "Can you break a hundred?", audioUrl: "audio/314.m4a" },
  { id: 315, en: "TELL SOMEONE I SAID HI", ua: "Передавай привіт", example: "Tell your mom I said hi.", audioUrl: "audio/315.m4a" },
  { id: 316, en: "TO THINK OUTSIDE THE BOX", ua: "Мислити нестандартно, думати креативно, виходити за рамки звичного", example: "We need to think outside the box to solve this problem.", audioUrl: "audio/316.m4a" },
  { id: 317, en: "TO HIT THE ROAD", ua: "Почати поїздку, стартонути, виїхати", example: "I'm hitting the road tomorrow at 8 p.m.", audioUrl: "audio/317.m4a" },
  { id: 318, en: "YOUR GUESS IS AS GOOD AS MINE", ua: "Я знаю так само, як і ти", example: "\"Where did she go?\" \"Your guess is as good as mine.\"", audioUrl: "audio/318.m4a" },
  { id: 319, en: "TO GET COLD FEET", ua: "Злякатися, мандражувати перед чимось важливим", example: "I got cold feet right before uploading my first video.", audioUrl: "audio/319.m4a" },
  { id: 320, en: "TO BE DOWN TO EARTH", ua: "Простий у спілкуванні, приземлений, без понтів", example: "Despite his wealth, he is always down to earth.", audioUrl: "audio/320.m4a" },
  { id: 321, en: "TO FACE THE MUSIC", ua: "Відповідати за свої вчинки, прийняти наслідки, розплачуватися за зроблене", example: "He lied to his wife and now he has to face the music.", audioUrl: "audio/321.m4a" },
  { id: 322, en: "TO PAY IN INSTALLMENTS", ua: "Платити в розстрочку", example: "\"That phone is so expensive!\" \"You can pay in installments.\"", audioUrl: "audio/322.m4a" },
  { id: 323, en: "TO GET ONE'S DUCKS IN A ROW", ua: "Все підготувати й організувати перед якоюсь подією", example: "I need to get my ducks in a row before the presentation.", audioUrl: "audio/323.m4a" },
  { id: 324, en: "TO BE IN A PICKLE", ua: "Вскочити в халепу, потрапити в просак, влипнути", example: "I lost my passport. I'm really in a pickle now.", audioUrl: "audio/324.m4a" },
  { id: 325, en: "THE HAIR OF THE DOG", ua: "Похмелитися", example: "I need the hair of the dog after last night.", audioUrl: "audio/325.m4a" },
  { id: 326, en: "TO TAKE THE EDGE OFF", ua: "Зняти напругу, трохи розслабитися, пом'якшити відчуття", example: "Music helps me take the edge off after work.", audioUrl: "audio/326.m4a" },
  { id: 327, en: "NO OFFENSE", ua: "Без образ", example: "No offense, but this cheese tastes like rubber.", audioUrl: "audio/327.m4a" },
  { id: 328, en: "TO HAVE A FIGHT", ua: "Посваритися", example: "My friend and I had a fight.", audioUrl: "audio/328.m4a" },
  { id: 329, en: "AT THE END OF THE DAY", ua: "Зрештою, врешті-решт, як не крути", example: "At the end of the day, family is what matters most.", audioUrl: "audio/329.m4a" },
  { id: 330, en: "TO NEED TO GET CASH", ua: "Зняти гроші", example: "We need to get cash. This place doesn't take cards.", audioUrl: "audio/330.m4a" },
  { id: 331, en: "TO GO MUSHROOM PICKING", ua: "Ходити за грибами", example: "Let's go mushroom picking after the rain.", audioUrl: "audio/331.m4a" },
  { id: 332, en: "WHEN I WAS I KID", ua: "В дитинстві", example: "We played outside all day when I was a kid.", audioUrl: "audio/332.m4a" },
  { id: 333, en: "TO DO WITHOUT", ua: "Обходитися без чогось, жити без чогось, перебиватися", example: "Can you do without food for a day?", audioUrl: "audio/333.m4a" },
  { id: 334, en: "TO BREAK IN", ua: "Розносити взуття", example: "These sneakers take forever to break in.", audioUrl: "audio/334.m4a" },
  { id: 335, en: "TO CRAMP", ua: "Зводити судомою, схопила судома, звело", example: "My leg is cramping.", audioUrl: "audio/335.m4a" },
  { id: 336, en: "TWO TIMES  BIGGER", ua: "В два рази більший", example: "My new apartment is two times bigger than the old one.", audioUrl: "audio/336.m4a" },
  { id: 337, en: "TO BE BORN WITH A SILVER SPOON IN ONE'S MOUTH", ua: "Народитися в багатій сім'ї", example: "She never had to worry about college expenses or finding a summer job. She was born with a silver spoon in her mouth.", audioUrl: "audio/337.m4a" },
  { id: 338, en: "TO BUTTER UP", ua: "Підлизуватися", example: "He's just buttering me up to borrow money.", audioUrl: "audio/338.m4a" },
  { id: 339, en: "CALM BEFORE THE STORM", ua: "Затишшя перед бурею", example: "She knew it was the calm before the storm.", audioUrl: "audio/339.m4a" },
  { id: 340, en: "TO CHASE WATERFALLS", ua: "Ганятися за вітром у полі, будувати повітряні замки", example: "Don't waste your life chasing waterfalls.", audioUrl: "audio/340.m4a" },
  { id: 341, en: "CLEAR AS MUD", ua: "Нічого не ясно, темний ліс", example: "His explanation was clear as mud.", audioUrl: "audio/341.m4a" },
  { id: 342, en: "DO YOU HAVE A MINUTE?", ua: "Можна тебе на секунду? Маєш хвилинку?", example: "\"Do you have a minute?\" \"Sure, what's up?»", audioUrl: "audio/342.m4a" },
  { id: 343, en: "TO MAKE SENSE", ua: "Мати сенс, бути логічним, звучати розумно", example: "Now everything makes sense.", audioUrl: "audio/343.m4a" },
  { id: 344, en: "TO ADD UP", ua: "Сходитися, в'язатися, складатися в одну картинку", example: "Wait, it doesn't add up.", audioUrl: "audio/344.m4a" },
  { id: 345, en: "TO BE NOT SURE ABOUT SOMETHING", ua: "Не бути впевненим у чомусь, сумніватися", example: "He's not sure about moving abroad.", audioUrl: "audio/345.m4a" },
  { id: 346, en: "IT'S ON THE TIP OF MY TONGUE", ua: "Крутиться на язиці", example: "His last name is on the tip of my tongue.", audioUrl: "audio/346.m4a" },
  { id: 347, en: "TO GIVE IT A SHOT", ua: "Спробувати", example: "\"There's a new restaurant downtown.\" \"Let's give it a shot this weekend.\"", audioUrl: "audio/347.m4a" },
  { id: 348, en: "CAN'T MAKE IT", ua: "Не могти прийти", example: "Sorry, I can't make it tonight.", audioUrl: "audio/348.m4a" },
  { id: 349, en: "TO GET TOGETHER", ua: "Пересіктись, зустрітись", example: "We should get together sometime soon.", audioUrl: "audio/349.m4a" },
  { id: 350, en: "TO BE OUT OF MY HANDS", ua: "Це вже не в моїх руках, від мене вже не залежить, я тут безсилий", example: "Sorry, it's out of my hands now.", audioUrl: "audio/350.m4a" },
  { id: 351, en: "I'M NOT BUYING IT", ua: "Я не поведусь на це", example: "\"I swear I was stuck in traffic!\" \"Yeah right, I'm not buying it.\"", audioUrl: "audio/351.m4a" },
  { id: 352, en: "THAT'S A GAME CHANGER", ua: "Щось круте або несподіване, що повністю змінює ситуацію", example: "That's a game changer.", audioUrl: "audio/352.m4a" },
  { id: 353, en: "TO MAKE ONE'S BED", ua: "Застелити ліжко", example: "I always make my bed before leaving the house.", audioUrl: "audio/353.m4a" },
  { id: 354, en: "TO GO GROCERY SHOPPING", ua: "Ходити за продуктами", example: "She went grocery shopping and forgot the milk.", audioUrl: "audio/354.m4a" },
  { id: 355, en: "TO BURN THE CANDLE AT BOTH ENDS", ua: "Виснажувати себе, працювати на знос", example: "Stop burning the candle at both ends and get some sleep.", audioUrl: "audio/355.m4a" },
  { id: 356, en: "TO DRIVE SOMEONE UP THE WALL", ua: "Доводити когось до ручки, виводити з себе", example: "My younger brother keeps asking the same question, and it's driving me up the wall.", audioUrl: "audio/356.m4a" },
  { id: 357, en: "TO JUDGE A BOOK BY ITS COVER", ua: "Судити по обкладинці", example: "\"He doesn't look like a doctor.\" \"Hey, don't judge a book by its cover.\"", audioUrl: "audio/357.m4a" },
  { id: 358, en: "ACTIONS SPEAK LOUDER THAN WORDS", ua: "Вчинки говорять голосніше за слова", example: "Stop talking and do something. Actions speak louder than words.", audioUrl: "audio/358.m4a" },
  { id: 359, en: "TO JINX", ua: "Зурочити, наврочити, накаркати", example: "Don't jinx it!", audioUrl: "audio/359.m4a" },
  { id: 360, en: "TO TRY ON", ua: "Приміряти, поміряти, приміряти на себе (одяг, взуття, аксесуари)", example: "She tried on five dresses before buying one.", audioUrl: "audio/360.m4a" },
  { id: 361, en: "TO SHOP AROUND", ua: "Походити по магазинах, поприцінюватися, подивитися варіанти", example: "\"Can I help you with something?\" \"I'm just shopping around, thanks.\"", audioUrl: "audio/361.m4a" },
  { id: 362, en: "TO PAY THE BILLS", ua: "Платити комуналку", example: "I need to pay the bills today.", audioUrl: "audio/362.m4a" },
  { id: 363, en: "TO RUN A RED LIGHT", ua: "Проїхати на червоний", example: "He ran a red light and got a ticket.", audioUrl: "audio/363.m4a" },
  { id: 364, en: "TO CALL OFF", ua: "Відміняти, скасувати", example: "They called off the concert because of the rain.", audioUrl: "audio/364.m4a" },
  { id: 365, en: "TO BUCKET DOWN", ua: "Лити як з відра", example: "Take an umbrella, it's bucketing down.", audioUrl: "audio/365.m4a" },
  { id: 366, en: "IT'S A WIN-WIN SITUATION", ua: "Це безпрограшна ситуація, обидві сторони у виграші", example: "Working from home is a win-win situation. I save time, the company saves money.", audioUrl: "audio/366.m4a" },
  { id: 367, en: "TO BE OUT OF LINE", ua: "Перейти межу, поводитися неприпустимо, переборщити", example: "That comment was completely out of line.", audioUrl: "audio/367.m4a" },
  { id: 368, en: "IT'S A NO-BRAINER", ua: "Очевидно, само собою, тут й думати немає чого", example: "Buying this car was a no-brainer.", audioUrl: "audio/368.m4a" },
  { id: 369, en: "TO CALM DOWN", ua: "Заспокоїтися, взяти себе в руки", example: "Try to calm down before the interview.", audioUrl: "audio/369.m4a" },
  { id: 370, en: "TO BE JEALOUS OF", ua: "Заздрити", example: "Why are you so jealous of his success?", audioUrl: "audio/370.m4a" },
  { id: 371, en: "A BACKSEAT DRIVER", ua: "Порадник з заднього сидіння, непроханий порадник", example: "My mom is such a backseat driver.", audioUrl: "audio/371.m4a" },
  { id: 372, en: "A BULL IN A CHINA SHOP", ua: "Як слон у посудній лавці, незграбний", example: "\"Why did you break the vase again?\" \"Sorry, I'm a bull in a china shop today.\"", audioUrl: "audio/372.m4a" },
  { id: 373, en: "I CAN'T WRAP MY HEAD AROUND IT", ua: "Не вкладається в голові", example: "I can't wrap my head around how he did it.", audioUrl: "audio/373.m4a" },
  { id: 374, en: "TO TAKE PAINKILLERS", ua: "Приймати знеболюючі", example: "He takes painkillers after the surgery.", audioUrl: "audio/374.m4a" },
  { id: 375, en: "TO BE A DARK HORSE", ua: "Темна конячка, недооцінений претендент", example: "Don't underestimate him. He's a dark horse.", audioUrl: "audio/375.m4a" },
  { id: 376, en: "A KNOW-IT-ALL", ua: "Всезнайка,  той, хто думає, що знає все", example: "She acts like a know-it-all in every meeting.", audioUrl: "audio/376.m4a" },
  { id: 377, en: "TO TELL SOMEONE OFF", ua: "Висварити, відчитати", example: "I'm going to tell him off when I see him.", audioUrl: "audio/377.m4a" },
  { id: 378, en: "TO HALF-ASS SOMETHING", ua: "Зробити щось через ж*пу", example: "I half-assed the task he gave me.", audioUrl: "audio/378.m4a" },
  { id: 379, en: "TO TAKE OUT A LOAN", ua: "Взяти кредит", example: "I had to take out a loan to buy my car.", audioUrl: "audio/379.m4a" },
  { id: 380, en: "TO BE A PIECE OF CAKE", ua: "Щось легке, легко", example: "Cooking pasta is a piece of cake.", audioUrl: "audio/380.m4a" },
  { id: 381, en: "MY PHONE DIED", ua: "Мій телефон сів", example: "My phone died in the middle of the call.", audioUrl: "audio/381.m4a" },
  { id: 382, en: "TO BE TIRED OF", ua: "Втомитися від", example: "She's tired of his lies.", audioUrl: "audio/382.m4a" },
  { id: 383, en: "TO BE RELATED TO", ua: "Бути пов'язаним з чимось", example: "That's not related to the topic.", audioUrl: "audio/383.m4a" },
  { id: 384, en: "TO PASS AWAY", ua: "Померти, піти з життя", example: "Sorry to hear your dad passed away.", audioUrl: "audio/384.m4a" },
  { id: 385, en: "TAKE MY WORD FOR IT", ua: "Повір мені на слово", example: "I know what I'm talking about. Take my word for it.", audioUrl: "audio/385.m4a" },
  { id: 386, en: "MURPHY'S LAW", ua: "Закон підлості", example: "Murphy's law, my phone died right when I needed it.", audioUrl: "audio/386.m4a" },
  { id: 387, en: "TO BE AFRAID OF", ua: "Боятися", example: "I'm afraid of spiders.", audioUrl: "audio/387.m4a" },
  { id: 388, en: "TO THROW SOMEONE UNDER THE BUS", ua: "Підставити когось, кинути під автобус", example: "\"Why don't you trust her anymore?\" \"She threw me under the bus once.\"", audioUrl: "audio/388.m4a" },
  { id: 389, en: "I DIDN'T HAVE ENOUGH SLEEP", ua: "Я не виспався", example: "I didn't get enough sleep last night.", audioUrl: "audio/389.m4a" },
  { id: 390, en: "IT RUNS IN THE FAMILY", ua: "Це сімейне", example: "\"Why is your whole family so good at math?\" \"Honestly, it just runs in the family.\"", audioUrl: "audio/390.m4a" },
  { id: 391, en: "IT WASN'T MEANT TO BE", ua: "Не судилося, не доля", example: "\"My visa got rejected again.\" \"Maybe it just wasn't meant to be this year.\"", audioUrl: "audio/391.m4a" },
  { id: 392, en: "TO WRITE DOWN", ua: "Записати", example: "Write down my phone number.", audioUrl: "audio/392.m4a" },
  { id: 393, en: "TO GET OVER", ua: "Пережити, оговтатися", example: "She's still trying to get over what happened.", audioUrl: "audio/393.m4a" },
  { id: 394, en: "IT'S MY PLEASURE", ua: "Із задоволенням, мені приємно", example: "It's my pleasure to help.", audioUrl: "audio/394.m4a" },
  { id: 395, en: "TO PICK SOMEONE UP", ua: "Підібрати когось", example: "Can you pick me up from the airport?", audioUrl: "audio/395.m4a" },
  { id: 396, en: "TO DROP SOMEONE OFF", ua: "Висадити когось", example: "Can you drop me off at the metro?", audioUrl: "audio/396.m4a" },
  { id: 397, en: "TO GET THE IMPRESSION", ua: "Мати враження", example: "She got the impression that something was wrong.", audioUrl: "audio/397.m4a" },
  { id: 398, en: "TO TAKE AFTER", ua: "Бути схожим", example: "She takes after her mom.", audioUrl: "audio/398.m4a" },
  { id: 399, en: "TAKE CARE", ua: "Бережи себе, тримайся", example: "Bye! Take care!", audioUrl: "audio/399.m4a" },
  { id: 400, en: "THE WAY I SEE IT", ua: "Як я це бачу, на мій погляд", example: "The way I see it, we have two options.", audioUrl: "audio/400.m4a" },
  { id: 401, en: "TO SUNBATHE", ua: "Засмагати", example: "Don't sunbathe without sunscreen.", audioUrl: "audio/401.m4a" },
  { id: 402, en: "TO START FROM SCRATCH", ua: "Почати з нуля", example: "Building a business from scratch is hard.", audioUrl: "audio/402.m4a" },
  { id: 403, en: "STILL WATERS RUN DEEP", ua: "У тихому болоті чорти водяться", example: "He's quiet, but still waters run deep.", audioUrl: "audio/403.m4a" },
  { id: 404, en: "TO TAKE PART", ua: "Брати участь", example: "I want to take part in the competition.", audioUrl: "audio/404.m4a" },
  { id: 405, en: "WHEN IN ROME, (DO AS THE ROMANS DO)", ua: "З вовками жити по-вовчому вити, у чужий монастир зі своїм статутом не ходять", example: "\"They take their shoes off inside the house here.\" \"Got it, when in Rome.\"", audioUrl: "audio/405.m4a" },
  { id: 406, en: "BETTER SAFE THAN SORRY", ua: "береженого Бог береже", example: "I always go to the shelter, better safe than sorry.", audioUrl: "audio/406.m4a" },
  { id: 407, en: "WHAT GOES AROUND COMES AROUND", ua: "Що посієш, те й пожнеш, карма наздожене", example: "I believe what goes around comes around.", audioUrl: "audio/407.m4a" },
  { id: 408, en: "NO PAIN, NO GAIN", ua: "без труда не виловиш і рибки з ставка", example: "Learning a new language is tough, but no pain, no gain.", audioUrl: "audio/408.m4a" },
  { id: 409, en: "FAIR ENOUGH", ua: "Справедливо, логічно, ну добре", example: "\"I'm not watching that movie. It's three hours long.\" \"Fair enough.\"", audioUrl: "audio/409.m4a" },
  { id: 410, en: "HAVING DONE SOMETING", ua: "Так як я вже це робив", example: "Having seen this movie, I didn't wanna go to the movies.", audioUrl: "audio/410.m4a" },
  { id: 411, en: "TO LOOK LIKE A MILLION DOLLARS", ua: "Виглядати на всі сто", example: "She looked like a million dollars at the wedding.", audioUrl: "audio/411.m4a" },
  { id: 412, en: "TO ZONE OUT", ua: "Залипнути, зависнути, задуматися", example: "Sorry, I zoned out for a second. What did you say?", audioUrl: "audio/412.m4a" },
  { id: 413, en: "TO BE DRESSED TO KILL", ua: "Одягнений з голочки", example: "\"Did you see her tonight?\" \"Yeah, she was dressed to kill.\"", audioUrl: "audio/413.m4a" },
  { id: 414, en: "TO THROW A MONKEY WRENCH IN THE WORKS", ua: "Вставляти палиці в колеса", example: "Great, the printer's broken again. That really throws a monkey wrench in the works.", audioUrl: "audio/414.m4a" },
  { id: 415, en: "TO BE MOUTHWATERING", ua: "Пальчики оближеш", example: "The pizza is mouthwatering. I can't wait to try it.", audioUrl: "audio/415.m4a" },
  { id: 416, en: "TO BEAR IN MIND", ua: "Мати на увазі, враховувати", example: "Bear in mind that the shops are closed on Sundays.", audioUrl: "audio/416.m4a" },
  { id: 417, en: "WHAT TIME DO YOU CLOSE?", ua: "О котрій ви зачиняєтесь?", example: "What time do you close?", audioUrl: "audio/417.m4a" },
  { id: 418, en: "CAN'T SEEM TO", ua: "Ніяк не можу", example: "I can't seem to find my keys.", audioUrl: "audio/418.m4a" },
  { id: 419, en: "IT'S NOT MY THING", ua: "Це не моє, мені не заходить", example: "I watched it, but it's not really my thing.", audioUrl: "audio/419.m4a" },
  { id: 420, en: "MY LEG FELL ASLEEP", ua: "В мене нога затікла", example: "I sat on the floor too long and my leg fell asleep.", audioUrl: "audio/420.m4a" },
  { id: 421, en: "TO LOOK UP TO", ua: "Рівнятися на когось, брати приклад", example: "All the kids look up to their coach.", audioUrl: "audio/421.m4a" },
  { id: 422, en: "DAYS ARE NUMBERED", ua: "Недовго залишилось", example: "My phone's days are numbered. I need a new one.", audioUrl: "audio/422.m4a" },
  { id: 423, en: "GOOD PERSONALITY", ua: "Гарний характер", example: "She has a good personality.", audioUrl: "audio/423.m4a" },
  { id: 424, en: "ON THE FIRST TRY", ua: "З першого разу", example: "I passed my driving test on the first try.", audioUrl: "audio/424.m4a" },
  { id: 425, en: "IT'S ONE THING TO DO STH, BUT ANOTHER TO DO STH", ua: "Одне діло ___,<em> </em>а інше<em> </em>___", example: "It's one thing to talk about change, but another to make it happen.", audioUrl: "audio/425.m4a" },
  { id: 426, en: "FOR GOOD", ua: "Назавжди", example: "He moved to Canada for good.", audioUrl: "audio/426.m4a" },
  { id: 427, en: "AS SOON AS", ua: "Як тільки, одразу", example: "Call me as soon as you get home.", audioUrl: "audio/427.m4a" },
  { id: 428, en: "TO BE NOT IN THE MOOD TO", ua: "Не в настрої щось робити", example: "She's not in the mood to talk right now.", audioUrl: "audio/428.m4a" },
  { id: 429, en: "I CAN'T THINK OF ANYTHING", ua: "Нічого не приходить в голову, не спадає на думку", example: "She asked for ideas, but I can't think of anything.", audioUrl: "audio/429.m4a" },
  { id: 430, en: "TO HIT IT OFF", ua: "одразу порозумітися, швидко знайти спільну мову, подружитися одразу", example: "I knew you two would hit it off.", audioUrl: "audio/430.m4a" },
  { id: 431, en: "MUST", ua: "Скоріш за все, походу", example: "The dog must be sick. It hasn't eaten for several days.", audioUrl: "audio/431.m4a" },
  { id: 432, en: "DON'T EVEN GET ME STARTED", ua: "Навіть не починай", example: "\"How was your trip?\" \"Don't even get me started.\"", audioUrl: "audio/432.m4a" },
  { id: 433, en: "THE NIGHT IS YOUNG", ua: "Ще не вечір, ще рано, вечір тільки починається", example: "Sales are slow today, but the night is young.", audioUrl: "audio/433.m4a" },
  { id: 434, en: "THE OTHER DAY", ua: "На днях", example: "We talked about this the other day.", audioUrl: "audio/434.m4a" },
  { id: 435, en: "COMPARED TO", ua: "В порівнянні з", example: "He is tall compared to me.", audioUrl: "audio/435.m4a" },
  { id: 436, en: "WHAT DO YOU HAVE TO LOSE?", ua: "Ти нічим не ризикуєш, нічого не втрачаєш", example: "Give it a try, what do you have to lose?", audioUrl: "audio/436.m4a" },
  { id: 437, en: "DON'T GET SMART WITH ME", ua: "«Не умнічай»", example: "Don't get smart with me.", audioUrl: "audio/437.m4a" },
  { id: 438, en: "TO SLEEP IN", ua: "Поспати довше, виспатися, повалятися в ліжку", example: "I sleep in on Saturdays.", audioUrl: "audio/438.m4a" },
  { id: 439, en: "DO YOU HAPPEN TO…", ua: "Ти випадково…?", example: "Do you happen to remember her name?", audioUrl: "audio/439.m4a" },
  { id: 440, en: "TO ORDER IN", ua: "Замовити їжу додому", example: "I'm too tired to cook, let's order in.", audioUrl: "audio/440.m4a" },
  { id: 441, en: "FOR THE PAST", ua: "Протягом + період часу", example: "I've been studying English for the past three years.", audioUrl: "audio/441.m4a" },
  { id: 442, en: "TO TAKE SOMEONE TO SOMEWHERE", ua: "Відвезти когось кудись", example: "I'll take you to the airport tomorrow.", audioUrl: "audio/442.m4a" },
  { id: 443, en: "I DON'T HAVE THE BANDWIDTH", ua: "Я не в ресурсі", example: "I don't have the bandwidth to take on another project.", audioUrl: "audio/443.m4a" },
  { id: 444, en: "TO HAVE A RUN IN MY TIGHTS", ua: "«стрілка» на колготках", example: "I got a run in my tights.", audioUrl: "audio/444.m4a" },
  { id: 445, en: "UNSOLICITED ADVICE", ua: "Непрохана порада", example: "He's always giving unsolicited advice.", audioUrl: "audio/445.m4a" },
  { id: 446, en: "TO BE HONEST", ua: "Якщо чесно", example: "To be honest, I'm a little nervous.", audioUrl: "audio/446.m4a" },

const STORAGE_KEY = "daglish_learned_v1";
const BARS_COUNT = 36;

/* ============================
   АУДІО ХУК — currentTime / duration / seek
   ============================ */
function useAudio() {
  const [playingId, setPlayingId] = useState(null);
  const [currentTime, setCurrentTime] = useState(0);
  const [duration, setDuration] = useState(0);
  const audioRef = useRef(null);

  const stop = useCallback(() => {
    if (audioRef.current) {
      try { audioRef.current.pause(); } catch (e) {}
      audioRef.current = null;
    }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    setPlayingId(null);
    setCurrentTime(0);
    setDuration(0);
  }, []);

  const speakWithBrowser = (phrase) => {
    if (!('speechSynthesis' in window)) {
      setPlayingId(null);
      return;
    }
    const text = `${phrase.en}. ${phrase.example}`;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.92;
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => /en-US/i.test(v.lang) && /Samantha|Google US English|Microsoft|Aria/i.test(v.name))
                   || voices.find(v => /en-US/i.test(v.lang))
                   || voices.find(v => /^en/i.test(v.lang));
    if (preferred) u.voice = preferred;
    u.onend = () => { setPlayingId(null); setCurrentTime(0); setDuration(0); };
    u.onerror = () => { setPlayingId(null); setCurrentTime(0); setDuration(0); };
    setDuration(text.length / 14);
    window.speechSynthesis.speak(u);
  };

  const play = useCallback((phrase) => {
    // toggle: клік по тій самій фразі — стоп
    if (playingId === phrase.id) {
      stop();
      return;
    }
    stop();
    setPlayingId(phrase.id);

    if (phrase.audioUrl) {
      const audio = new Audio(phrase.audioUrl);
      audioRef.current = audio;
      audio.addEventListener('loadedmetadata', () => {
        if (isFinite(audio.duration)) setDuration(audio.duration);
      });
      audio.addEventListener('durationchange', () => {
        if (isFinite(audio.duration)) setDuration(audio.duration);
      });
      audio.addEventListener('timeupdate', () => setCurrentTime(audio.currentTime));
      audio.addEventListener('ended', () => stop());
      audio.addEventListener('error', () => speakWithBrowser(phrase));
      audio.play().catch(() => speakWithBrowser(phrase));
    } else {
      speakWithBrowser(phrase);
    }
  }, [playingId, stop]);

  const seek = useCallback((ratio) => {
    if (audioRef.current && isFinite(audioRef.current.duration)) {
      const t = Math.max(0, Math.min(1, ratio)) * audioRef.current.duration;
      audioRef.current.currentTime = t;
      setCurrentTime(t);
    }
  }, []);

  useEffect(() => () => stop(), [stop]);
  return { play, stop, seek, playingId, currentTime, duration };
}

/* ============================
   VOICE PLAYER (Telegram-style)
   ============================ */
function VoicePlayer({ phrase, isPlaying, currentTime, duration, onPlay, onSeek }) {
  // детерміновані висоти барів за id (псевдо-вейвформа)
  const bars = useMemo(() => {
    const seed = phrase.id * 13 + 7;
    return Array.from({ length: BARS_COUNT }, (_, i) => {
      const a = Math.sin(seed + i * 0.7) * 0.5 + 0.5;
      const b = Math.sin(seed * 1.3 + i * 1.9) * 0.5 + 0.5;
      const v = (a * 0.6 + b * 0.4);
      const mid = 1 - Math.abs(i / BARS_COUNT - 0.5) * 1.3;
      return Math.max(0.18, Math.min(1, v * mid + 0.2));
    });
  }, [phrase.id]);

  const progress = isPlaying && duration > 0
    ? Math.min(1, currentTime / duration)
    : 0;

  const formatTime = (s) => {
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
  };

  // Як в Telegram: при відтворенні — час що залишився
  const displayTime = isPlaying
    ? formatTime(Math.max(0, duration - currentTime))
    : (duration > 0 ? formatTime(duration) : '0:00');

  const handleBarsClick = (e) => {
    if (!isPlaying || !duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    onSeek(ratio);
  };

  return (
    <div className={`voice-player ${isPlaying ? 'active' : ''}`}>
      <button
        onClick={(e) => { e.stopPropagation(); onPlay(phrase); }}
        className="vp-play"
        aria-label={isPlaying ? 'Пауза' : 'Прослухати'}
      >
        {isPlaying ? (
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="5" width="4" height="14" rx="1"/>
            <rect x="14" y="5" width="4" height="14" rx="1"/>
          </svg>
        ) : (
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        )}
      </button>

      <div className="vp-bars" onClick={handleBarsClick}>
        {bars.map((h, i) => (
          <span
            key={i}
            className={`vp-bar ${i / bars.length < progress ? 'active' : ''}`}
            style={{ height: `${h * 100}%` }}
          />
        ))}
      </div>

      <div className="vp-time">{displayTime}</div>
    </div>
  );
}

      </div>

            <div className="flex items-baseline justify-between mb-2">
              <div className="font-mono text-xs uppercase tracking-widest text-white/40">Прогрес</div>
              <div className="font-display text-sm">
                <span className="text-[var(--accent)] font-bold text-2xl tabular-nums">{done}</span>
                <span className="text-white/40"> / {total}</span>
              </div>
            </div>
            <div className="progress-track">
              <div className="progress-fill" style={{ width: `${percent}%` }} />
            </div>
          </div>

          <button onClick={() => setModalOpen(true)} className="accent-btn self-start sm:self-auto">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            Вивчені фрази
            {done > 0 && (
              <span className="bg-[#0a0a0b] text-[var(--accent)] rounded-full px-2 py-0.5 text-xs font-mono">{done}</span>
            )}
          </button>
        </div>
      </section>

      {/* ПОШУК */}
      <section className="max-w-6xl mx-auto px-5 sm:px-8 mb-8">
        <div className="relative max-w-md">
          <svg className="absolute left-4 top-1/2 -translate-y-1/2 text-white/30" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder="Шукати фразу або номер…"
            className="w-full bg-white/[0.03] border border-white/10 rounded-full py-3 pl-11 pr-4 text-sm text-white placeholder-white/30 focus:outline-none focus:border-[var(--accent)]/50 focus:bg-white/[0.05] transition"
          />
        </div>
      </section>

      {/* ГРИД ФРАЗ */}
      <section className="max-w-6xl mx-auto px-5 sm:px-8 pb-16">
        {visible.length === 0 ? (
          <div className="text-center py-20 border border-dashed border-white/10 rounded-3xl">
            <div className="text-6xl mb-4">🎉</div>
            <h3 className="font-display text-3xl font-bold mb-2">Усе вивчено!</h3>
            <p className="text-white/50 mb-6">Усі фрази у папці «Вивчені фрази». Час за новою порцією.</p>
            <button onClick={() => setModalOpen(true)} className="accent-btn">Вивчені фрази</button>
          </div>
        ) : (
          <>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              {visible.slice(0, limit).map(({ phrase, num }) => (
                <PhraseCard
                  key={phrase.id}
                  phrase={phrase}
                  num={num}
                  learned={false}
                  onToggle={toggle}
                  isPlaying={playingId === phrase.id}
                  currentTime={currentTime}
                  duration={duration}
                  onPlay={play}
                  onSeek={seek}
                />
              ))}
            </div>
            {visible.length > limit && (
              <div className="flex justify-center mt-10">
                <button onClick={() => setLimit(l => l + 60)} className="accent-btn">
                  Показати ще ({visible.length - limit})
                </button>
              </div>
            )}
          </>
        )}
      </section>

      {/* ФУТЕР */}
      <footer className="border-t border-white/5 mt-10">
        <div className="max-w-6xl mx-auto px-5 sm:px-8 py-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 text-sm">
          <div className="text-white/40">
            © {new Date().getFullYear()} Дмитро Дадак
          </div>
          <div className="flex items-center gap-5 text-white/50">
            <a href="https://t.me/dadakdm" target="_blank" rel="noopener" className="hover:text-[var(--accent)] transition">Telegram</a>
            <a href="https://instagram.com/engdadak" target="_blank" rel="noopener" className="hover:text-[var(--accent)] transition">Instagram</a>
          </div>
        </div>
      </footer>

      <LearnedModal
        open={modalOpen}
        onClose={() => setModalOpen(false)}
        learnedPhrases={learnedPhrases}
        onUnlearn={toggle}
        onPlay={play}
        onSeek={seek}
        playingId={playingId}
        currentTime={currentTime}
        duration={duration}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
